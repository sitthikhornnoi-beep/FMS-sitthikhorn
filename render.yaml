services:
  - type: web
    name: fms-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3010
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: fms-web
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: fms-postgres
          property: connectionString

databases:
  - name: fms-postgres
    databaseName: ums_prod
    user: postgres
    plan: free
    region: singapore
