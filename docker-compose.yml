services:
  db:
    image: postgres:16-alpine
    container_name: fms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pwd}
      POSTGRES_DB: ${DB_NAME:-ums_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # แมปพอร์ต 5433 บน Host เพื่อไม่ให้ชนกับ PostgreSQL ของเครื่องหลัก (พอร์ต 5432)
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fms-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fms-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_secure_pwd}@db:5432/${DB_NAME:-ums_prod}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      APP_URL: ${APP_URL:-http://localhost:3010}
      PORT: 3010
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-App <no-reply@example.com>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      # Persistent storage สำหรับไฟล์ที่อัปโหลด
      - uploads_data:/app/public/uploads
    ports:
      - "3010:3010"
    networks:
      - fms-network

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: fms-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://web:3010
    depends_on:
      web:
        condition: service_healthy
    networks:
      - fms-network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  fms-network:
    driver: bridge
